{% extends "base.html" %}
{% block content %}
<div class="card">
  <h1>已发布明细查询</h1>
  <p class="muted">展示每期最新一次发布的逐表排放与所用因子；新结果发布成功前，原已发布内容照常可查。</p>
  <div class="row">
    <div class="field"><label>省份</label>
      <select id="province">{% for p in provinces %}<option>{{ p }}</option>{% endfor %}</select></div>
    <div class="field"><label>月份</label><input type="month" id="month"></div>
    <button class="ghost" onclick="query()">查询</button>
  </div>
  <div id="msg" class="msg"></div>
  <div id="detail"></div>
</div>
<div class="card">
  <h2>全部已发布期次</h2>
  <p class="muted" id="indexNote"></p>
  <div id="list"></div>
</div>
<div class="card">
  <h2>最新发布索引补建</h2>
  <p class="muted">列表建齐后只读每省月一行的最新发布索引。补建未完成时列表仍按发布号取各期最新，可正常查询；补建按批次推进，期间可继续发布，中断后从已完成批次继续。</p>
  <div class="row">
    <div class="field"><label>每批期数</label><input type="number" id="batchSize" min="1" max="1000" value="50"></div>
    <button class="ghost" onclick="buildBatch()">补建一批</button>
  </div>
  <div id="indexMsg" class="msg"></div>
  <div id="indexStatus"></div>
</div>
<script>
const srcName = s => s === 'province' ? '省级' : '全国';
async function query() {
  if (!month.value) { msg.className='msg err'; msg.textContent='请选择月份'; return; }
  const r = await fetch(`/api/published?province=${encodeURIComponent(province.value)}&month=${month.value}`);
  const d = await r.json();
  if (!r.ok) { msg.className='msg warn'; msg.textContent = typeof d.detail === 'string' ? d.detail : '查询失败'; detail.innerHTML=''; return; }
  msg.className='msg ok';
  msg.textContent = `发布 #${d.id}，发布时间 ${d.published_at}，合计 ${d.total_kwh} 千瓦时、${d.total_emissions} kg CO₂`;
  detail.innerHTML = '<table><tr><th>表号</th><th>千瓦时</th><th>因子来源</th><th>因子值</th><th>因子年度</th><th>排放量(kg CO₂)</th></tr>' +
    d.details.map(x => `<tr><td>${x.meter_no}</td><td class="num">${x.kwh}</td><td>${srcName(x.factor_source)}</td>
      <td class="num">${x.factor_value}</td><td>${x.factor_year}</td><td class="num">${x.emissions}</td></tr>`).join('') + '</table>';
}
async function loadList() {
  const d = await (await fetch('/api/published/list')).json();
  if (!d.rows.length) { list.innerHTML = '<p class="muted">暂无发布</p>'; return; }
  list.innerHTML = '<table><tr><th>省份</th><th>月份</th><th>合计千瓦时</th><th>合计排放(kg CO₂)</th><th>发布时间</th></tr>' +
    d.rows.map(r => `<tr><td>${r.province}</td><td>${r.month}</td><td class="num">${r.total_kwh}</td>
      <td class="num">${r.total_emissions}</td><td>${r.published_at}</td></tr>`).join('') + '</table>';
}
let indexPolls = 0;
async function loadIndexStatus() {
  const s = await (await fetch('/api/published/index/status')).json();
  const done = s.completed ? s.indexed_periods : s.backfilled_periods;
  const pct = s.total_periods ? Math.round(done * 100 / s.total_periods) : 100;
  indexStatus.innerHTML = `<p class="muted">状态：${s.completed ? '已建齐（列表走索引）' : '补建中（列表走即时聚合）'}；
    已补建 ${done} / ${s.total_periods} 期（${pct}%）；索引共 ${s.indexed_periods} 期；每批 ${s.batch_size} 期；最后更新 ${s.updated_at || '—'}</p>`;
  indexNote.textContent = s.completed
    ? '列表当前查询「每省月最新发布索引」。'
    : `索引补建中（已补建 ${done}/${s.total_periods} 期），列表当前按发布号即时取各期最新，结果与建齐后一致。`;
  // 未建齐时定时刷新进度（限次，避免页面长时间空转）
  if (!s.completed && indexPolls < 60) {
    indexPolls += 1;
    setTimeout(refreshAll, 2000);
  }
  return s;
}
async function refreshAll() {
  await loadIndexStatus();
  await loadList();
}
async function buildBatch() {
  const body = {batch_size: +batchSize.value || 50};
  const r = await fetch('/api/published/index/backfill', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  const d = await r.json();
  if (!r.ok) { indexMsg.className='msg err'; indexMsg.textContent = typeof d.detail === 'string' ? d.detail : '补建失败'; return; }
  indexMsg.className='msg ok';
  indexMsg.textContent = d.completed ? '索引已建齐。' : `本批完成 ${d.processed} 期，可继续补建。`;
  indexPolls = 0;
  await refreshAll();
}
refreshAll();
</script>
{% endblock %}
